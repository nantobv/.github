# Starter Dependabot configuration for nantobv/* repos.
#
# Copy this file to .github/dependabot.yml in your repo, then uncomment
# the ecosystem section(s) that match the project's stack.
#
# Notes:
# - The github-actions block keeps SHA-pinned action references current.
#   Dependabot rewrites the pinned SHA *and* the trailing `# vX.Y.Z` comment,
#   which is what `pinact run --check` expects.
# - Patch and minor updates are grouped into a single weekly PR per ecosystem
#   so CI doesn't fan out across dozens of PRs. Major updates remain individual.
# - For private repos, vulnerability alerts come from Dependabot for free on
#   Enterprise Cloud; security updates open PRs even when version updates are
#   disabled for that ecosystem.
#
# Reference: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["patch", "minor"]

