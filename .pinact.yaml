# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/refs/heads/main/json-schema/pinact.json
# pinact - https://github.com/suzuki-shunsuke/pinact
version: 3

ignore_actions:
  # dtolnay/rust-toolchain uses floating branch refs by design
  # (stable/beta/nightly/master move forward as new Rust releases land);
  # pinning to a SHA would freeze the compiler version and defeat the action.
  - name: dtolnay/rust-toolchain
    ref: stable
  - name: dtolnay/rust-toolchain
    ref: beta
  - name: dtolnay/rust-toolchain
    ref: nightly
  - name: dtolnay/rust-toolchain
    ref: master
  # Same-org reusable workflows track @main by design — every nantobv repo
  # consumes nantobv/.github/.github/workflows/*.yml@main, and the required-
  # workflow ruleset rule pins to refs/heads/main too. SHA-pinning the ref
  # would defeat the "one place to update org policy" model.
  - name: nantobv/.github
    ref: main
