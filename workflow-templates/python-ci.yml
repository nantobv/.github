# Created from the nantobv/.github workflow template "Python CI".
# Wraps the org-wide reusable Python workflow (uv-based: ruff lint+format,
# mypy --strict on opt-in paths, pytest with coverage, pip-audit) plus
# the pinact policy enforcement.
#
# Inputs documented at:
#   https://github.com/nantobv/.github/blob/main/.github/workflows/python-ci.yml
name: CI

on:
  push:
    branches: [$default-branch]
  pull_request:
  # Run inside the merge queue too, so enabling a queue later doesn't let
  # code merge without the CI that validates the actual merge result.
  merge_group:

permissions:
  contents: read

jobs:
  py:
    uses: nantobv/.github/.github/workflows/python-ci.yml@main
    # By default CI follows the repo's own .python-version / requires-python.
    # Uncomment to pin a Python explicitly and/or turn on mypy --strict for
    # the listed paths (empty/absent disables mypy):
    # with:
    #   python-version: '3.12'
    #   mypy-paths: 'src tests'

  pinact:
    uses: nantobv/.github/.github/workflows/pinact-check.yml@main
