# Composite: Go toolchain setup with module caching.
#
# Collapses the dual setup-go block (go-version vs go-version-file) that
# every job in go-ci.yml needs into one step, so the two variants stay in
# sync from a single place. Referenced as
# `nantobv/.github/.github/actions/setup-go@main` from the reusable Go CI;
# GitHub fetches it automatically in the caller repo's context.
#
# Note: composite run-steps do NOT inherit a job's defaults.run
# working-directory, so the module directory is an explicit input.
name: Setup Go
description: Install Go (honoring an optional go-version-file) with go.sum-keyed module caching.
inputs:
  go-version:
    description: "Go version (used when go-version-file is empty)"
    required: false
    default: 'stable'
  go-version-file:
    description: "Optional go version file relative to working-directory; takes precedence over go-version"
    required: false
    default: ''
  working-directory:
    description: "Module directory containing go.sum"
    required: false
    default: '.'
runs:
  using: composite
  steps:
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      if: ${{ inputs.go-version-file == '' }}
      with:
        go-version: ${{ inputs.go-version }}
        cache: true
        cache-dependency-path: ${{ inputs.working-directory }}/go.sum

    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      if: ${{ inputs.go-version-file != '' }}
      with:
        go-version-file: ${{ inputs.working-directory }}/${{ inputs.go-version-file }}
        cache: true
        cache-dependency-path: ${{ inputs.working-directory }}/go.sum
