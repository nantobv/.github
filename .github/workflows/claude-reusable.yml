# Reusable Claude Code responder workflow for the nantobv org.
#
# Caller pattern (in any nantobv repo, .github/workflows/claude.yml):
#
#   name: Claude Code
#   on:
#     issue_comment:
#       types: [created]
#     pull_request_review_comment:
#       types: [created]
#     issues:
#       types: [opened]
#     pull_request_review:
#       types: [submitted]
#   jobs:
#     claude:
#       uses: nantobv/.github/.github/workflows/claude-reusable.yml@main
#       secrets: inherit
#
# Authenticates via the org-level secret CLAUDE_CODE_OAUTH_TOKEN
# (subscription/OAuth path; no API billing). The secret must be reachable
# by the caller repo — an org-level secret with "All repositories" scope
# covers every nantobv repo automatically.
#
# Security: caller workflows must gate invocations on both a @claude mention
# and an OWNER/MEMBER/COLLABORATOR author. The original webhook payload is
# available in the caller workflow, not reliably inside this workflow_call
# callee, so duplicating the gate here would skip legitimate invocations.
name: Reusable Claude Code

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Serialize invocations per issue/PR. Two quick @claude mentions on the same
# thread would otherwise spin up two runners that both checkout and push to
# the same Claude branch — a race. cancel-in-progress is intentionally false:
# a superseding mention should queue behind the in-flight reply, not kill it
# mid-push. github.event here is the caller's triggering event.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    # Bound worst-case runtime. Default GHA job timeout is 360 minutes,
    # which lets a runaway Claude task (infinite tool loop, bad prompt,
    # etc.) burn substantial subscription quota per invocation. 15 min
    # is generous for any genuine @claude reply / small refactor task;
    # longer work should be split across multiple invocations.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Bun
        # Replaces the upstream `curl https://bun.sh/install | bash` step
        # with a SHA-pinned action so a compromise of bun.sh's installer
        # can't substitute the binary that the Claude action later
        # executes under write-scoped job permissions + OAuth token.
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@700e7f8316990de46bed556429765647af760efc # v1.0.176
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_bun_executable: ${{ steps.bun.outputs.bun-path }}
          additional_permissions: |
            actions: read
