# Reusable Claude Code responder workflow for the nantobv org.
#
# Caller pattern (in any nantobv repo, .github/workflows/claude.yml):
#
#   name: Claude Code
#   on:
#     issue_comment:
#       types: [created]
#     pull_request_review_comment:
#       types: [created]
#     issues:
#       types: [opened]
#     pull_request_review:
#       types: [submitted]
#   jobs:
#     claude:
#       uses: nantobv/.github/.github/workflows/claude-reusable.yml@main
#       secrets: inherit
#
# Authenticates via the org-level secret CLAUDE_CODE_OAUTH_TOKEN
# (subscription/OAuth path; no API billing). The secret must be reachable
# by the caller repo — an org-level secret with "All repositories" scope
# covers every nantobv repo automatically.
#
# Security: the if: filter requires both a @claude mention AND that the
# author is an OWNER/MEMBER/COLLABORATOR. Without the author gate, anyone
# who can comment on a public nantobv repo could fire Claude and burn
# the subscription quota. All github.event.*.body|title references are
# used only inside contains(...) expressions — never interpolated into
# shell commands, so no command-injection surface.
name: Reusable Claude Code

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  claude:
    # Bound worst-case runtime. Default GHA job timeout is 360 minutes,
    # which lets a runaway Claude task (infinite tool loop, bad prompt,
    # etc.) burn substantial subscription quota per invocation. 15 min
    # is generous for any genuine @claude reply / small refactor task;
    # longer work should be split across multiple invocations.
    timeout-minutes: 15
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Bun
        # Replaces the upstream `curl https://bun.sh/install | bash` step
        # with a SHA-pinned action so a compromise of bun.sh's installer
        # can't substitute the binary that the Claude action later
        # executes under write-scoped job permissions + OAuth token.
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@86eb26bf0139bdd75acd15ea5f00f45ee0a284c2 # v1.0.122
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_bun_executable: ${{ steps.bun.outputs.bun-path }}
          additional_permissions: |
            actions: read
