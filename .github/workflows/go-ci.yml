# Reusable Go CI workflow for the nantobv org.
#
# Usage from a caller repo (.github/workflows/ci.yml):
#
#   name: CI
#   on:
#     push:
#       branches: [main]
#     pull_request:
#   jobs:
#     go:
#       uses: nantobv/.github/.github/workflows/go-ci.yml@main
#       with:
#         go-version: '1.24'
#
name: Reusable Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version (e.g. '1.24', or 'stable')"
        type: string
        default: 'stable'
      go-version-file:
        description: "Optional Go version file, relative to working-directory (e.g. 'go.mod'). Takes precedence over go-version."
        type: string
        default: ''
      working-directory:
        description: "Subdirectory containing go.mod"
        type: string
        default: '.'
      run-race:
        description: "Run tests with -race"
        type: boolean
        default: true
      run-vuln-scan:
        description: "Run govulncheck and osv-scanner"
        type: boolean
        default: true
      golangci-lint-version:
        description: "Pinned golangci-lint version"
        type: string
        default: 'v2.12.2'
      gofumpt-version:
        description: "Pinned gofumpt module version"
        type: string
        default: 'v0.10.0'
      govulncheck-version:
        description: "Pinned golang.org/x/vuln module version"
        type: string
        default: 'v1.3.0'
      osv-scanner-version:
        description: "Pinned osv-scanner/v2 module version"
        type: string
        default: 'v2.3.8'
    secrets:
      modules-token:
        description: >-
          Optional token with read access to private github.com/nantobv
          repos, for private module dependencies. Repos with only public
          deps can omit it. See ORG-POLICY.md "Private Go modules".
        required: false

# Least-privilege default. Individual jobs upgrade as needed.
permissions:
  contents: read

# Cancel superseded PR runs; keep main runs. Inside a called reusable
# workflow, github.workflow resolves to the *caller's* workflow name, so a
# workflow-specific suffix keeps two language reusables invoked from one
# caller (e.g. a language=mixed repo's "CI") from sharing a group and
# cancelling each other. Same reasoning as pinact-check.yml's "-pinact".
concurrency:
  group: ${{ github.workflow }}-go-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Layer 1: correctness - format, vet, lint, tidy
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Bound worst-case runtime. Default GHA job timeout is 360 min, long
    # enough for a stalled `go install` or hung tool to burn hours of
    # runner time across every nantobv repo. Generous ceiling, not a target.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: nantobv/.github/.github/actions/setup-go@main # zizmor: ignore[unpinned-uses] same-org composite action tracks @main by design; pinact exception declared org-wide in nantobv/.github/.pinact.yaml.
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file }}
          working-directory: ${{ inputs.working-directory }}
          modules-token: ${{ secrets.modules-token }}

      - name: gofumpt (stricter gofmt)
        env:
          GOFUMPT_VERSION: ${{ inputs.gofumpt-version }}
        run: |
          go install "mvdan.cc/gofumpt@${GOFUMPT_VERSION}"
          diff=$(gofumpt -l -d .)
          if [ -n "$diff" ]; then
            echo "::error::gofumpt found formatting issues:"
            echo "$diff"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Provision org-wide golangci-lint defaults (if caller has no .golangci.yml)
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f .golangci.yml ] || [ -f .golangci.yaml ]; then
            echo "Caller has its own .golangci.yml — using that."
            echo "GOLANGCI_ARGS=" >> "$GITHUB_ENV"
          else
            echo "Caller has no .golangci.yml — writing org-wide defaults."
            cat > /tmp/org-golangci.yml <<'CFG'
          # Org-wide golangci-lint defaults for nantobv/* Go repos.
          # Initial org ratchet: keep the standard safety set and add
          # structural anti-bloat lints that catch common agent-generated code
          # drift. Repos with heavier legacy baselines should commit their own
          # .golangci.yml and lower thresholds intentionally over time.
          version: "2"
          linters:
            default: standard
            enable:
              - dupl
              - funlen
              - gocognit
              - gocyclo
            settings:
              dupl:
                threshold: 260
              errcheck:
                exclude-functions:
                  - fmt.Fprint
                  - fmt.Fprintln
                  - fmt.Fprintf
                  - io.Copy
                  - os.Remove
              funlen:
                lines: 260
                statements: 170
              gocognit:
                min-complexity: 70
              gocyclo:
                min-complexity: 50
              staticcheck:
                checks:
                  - all
                  - -QF*       # quickfix style suggestions
                  - -ST1000    # package doc requirement
              goconst:
                min-occurrences: 6
            exclusions:
              rules:
                # Defer-close patterns on io.Closer values: not actionable.
                - linters:
                    - errcheck
                  text: "Error return value of `[^`]+\\.Close` is not checked"
                # Tests don't need to check sql.Row.Scan.
                - path: _test\.go
                  linters:
                    - errcheck
                  text: "Error return value of `\\(\\*database/sql\\.Row\\)\\.Scan` is not checked"
                # goconst on test files is too noisy on fixture strings.
                - path: _test\.go
                  linters:
                    - goconst
                    - dupl
                    - funlen
                    - gocognit
                    - gocyclo
          CFG
            echo "GOLANGCI_ARGS=--config=/tmp/org-golangci.yml" >> "$GITHUB_ENV"
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: ${{ inputs.golangci-lint-version }}
          working-directory: ${{ inputs.working-directory }}
          args: ${{ env.GOLANGCI_ARGS }}

      - name: go mod tidy is clean
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go mod tidy produced changes - commit them"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Layer 1: correctness - build + tests with race detector and coverage
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: nantobv/.github/.github/actions/setup-go@main # zizmor: ignore[unpinned-uses] same-org composite action tracks @main by design; pinact exception declared org-wide in nantobv/.github/.pinact.yaml.
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file }}
          working-directory: ${{ inputs.working-directory }}
          modules-token: ${{ secrets.modules-token }}

      - name: Build (smoke test all packages compile)
        run: go build ./...

      - name: Test
        run: |
          flags=(-shuffle=on -coverprofile=coverage.out -covermode=atomic)
          if [ "${{ inputs.run-race }}" = "true" ]; then
            flags=(-race "${flags[@]}")
          fi
          go test "${flags[@]}" ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: ${{ inputs.working-directory }}/coverage.out
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Layer 2: supply chain - vulnerability scanning
  # ---------------------------------------------------------------------------
  vuln:
    name: Vulnerability scan
    if: ${{ inputs.run-vuln-scan }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: nantobv/.github/.github/actions/setup-go@main # zizmor: ignore[unpinned-uses] same-org composite action tracks @main by design; pinact exception declared org-wide in nantobv/.github/.pinact.yaml.
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file }}
          working-directory: ${{ inputs.working-directory }}
          modules-token: ${{ secrets.modules-token }}

      - name: govulncheck
        env:
          GOVULNCHECK_VERSION: ${{ inputs.govulncheck-version }}
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

      - name: osv-scanner
        env:
          OSV_SCANNER_VERSION: ${{ inputs.osv-scanner-version }}
        run: |
          go install "github.com/google/osv-scanner/v2/cmd/osv-scanner@${OSV_SCANNER_VERSION}"
          osv-scanner --recursive .
