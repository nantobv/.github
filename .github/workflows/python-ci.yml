# Reusable Python CI workflow for the nantobv org.
#
# Usage from a caller repo (.github/workflows/ci.yml):
#
#   name: CI
#   on:
#     push:
#       branches: [main]
#     pull_request:
#   jobs:
#     py:
#       uses: nantobv/.github/.github/workflows/python-ci.yml@main
#       with:
#         python-version: '3.12'
#         mypy-paths: 'src tests'
#
# This workflow assumes `uv` for dependency management (per Emanuele's stack).
# It expects checked-in lockfiles by default; callers can disable uv-sync-locked
# while bootstrapping a new Python project.
name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version (e.g. '3.12')"
        type: string
        default: '3.12'
      working-directory:
        description: "Subdirectory containing pyproject.toml"
        type: string
        default: '.'
      mypy-paths:
        description: "Space-separated paths to type-check with mypy. Empty disables mypy."
        type: string
        default: ''
      run-tests:
        description: "Run pytest"
        type: boolean
        default: true
      run-vuln-scan:
        description: "Run pip-audit"
        type: boolean
        default: true
      uv-version:
        description: "Pinned uv version"
        type: string
        default: '0.11.14'
      uv-sync-locked:
        description: "Require the checked-in uv.lock during uv sync"
        type: boolean
        default: true
      pip-audit-version:
        description: "Pinned pip-audit version"
        type: string
        default: '2.10.0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Layer 1: correctness - ruff (lint + format) + mypy
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Bound worst-case runtime (default GHA timeout is 360 min). Generous
    # ceiling for a hung uv sync / ruff run, not a target.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: nantobv/.github/.github/actions/setup-python-uv@main # zizmor: ignore[unpinned-uses] same-org composite action tracks @main by design; pinact exception declared org-wide in nantobv/.github/.pinact.yaml.
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          uv-sync-locked: ${{ inputs.uv-sync-locked }}
          working-directory: ${{ inputs.working-directory }}

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  type:
    name: Type check
    if: ${{ inputs.mypy-paths != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: nantobv/.github/.github/actions/setup-python-uv@main # zizmor: ignore[unpinned-uses] same-org composite action tracks @main by design; pinact exception declared org-wide in nantobv/.github/.pinact.yaml.
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          uv-sync-locked: ${{ inputs.uv-sync-locked }}
          working-directory: ${{ inputs.working-directory }}

      - name: mypy
        env:
          MYPY_PATHS: ${{ inputs.mypy-paths }}
        run: |
          read -r -a mypy_paths <<< "${MYPY_PATHS}"
          uv run mypy --strict "${mypy_paths[@]}"

  # ---------------------------------------------------------------------------
  # Layer 1: correctness - pytest
  # ---------------------------------------------------------------------------
  test:
    name: Test
    if: ${{ inputs.run-tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: nantobv/.github/.github/actions/setup-python-uv@main # zizmor: ignore[unpinned-uses] same-org composite action tracks @main by design; pinact exception declared org-wide in nantobv/.github/.pinact.yaml.
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          uv-sync-locked: ${{ inputs.uv-sync-locked }}
          working-directory: ${{ inputs.working-directory }}

      - name: pytest
        # Only request coverage when pytest-cov is actually installed in the
        # resolved env; otherwise the --cov flags abort pytest before a single
        # test runs, failing CI for a missing dev-dep rather than a real fault.
        run: |
          if uv run python -c 'import pytest_cov' >/dev/null 2>&1; then
            uv run pytest -ra --cov --cov-report=xml --cov-report=term
          else
            echo "::notice::pytest-cov not installed; running pytest without coverage."
            uv run pytest -ra
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage
          path: ${{ inputs.working-directory }}/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Layer 2: supply chain - pip-audit against the resolved environment
  # ---------------------------------------------------------------------------
  vuln:
    name: Vulnerability scan
    if: ${{ inputs.run-vuln-scan }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: nantobv/.github/.github/actions/setup-python-uv@main # zizmor: ignore[unpinned-uses] same-org composite action tracks @main by design; pinact exception declared org-wide in nantobv/.github/.pinact.yaml.
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          uv-sync-locked: ${{ inputs.uv-sync-locked }}
          working-directory: ${{ inputs.working-directory }}

      - name: pip-audit
        env:
          PIP_AUDIT_VERSION: ${{ inputs.pip-audit-version }}
        run: uv run --with "pip-audit==${PIP_AUDIT_VERSION}" pip-audit --strict
