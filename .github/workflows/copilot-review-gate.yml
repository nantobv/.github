# Reusable "bot review gate" for the nantobv org.
#
# Blocks merge until BOTH are true on the PR:
#   1. Copilot has reviewed the *current HEAD commit* (not a stale earlier one), and
#   2. every review thread (Copilot's or a human/@claude review) is resolved.
#
# Why a custom check instead of native branch protection:
#   - GitHub's `required_review_thread_resolution` only blocks on *existing*
#     unresolved review threads. Copilot reviews asynchronously, so a fast
#     self-merge can land *before* Copilot posts its threads — nothing to
#     resolve yet, merge succeeds, comments arrive seconds later (observed).
#   - This check starts RED the moment a PR opens and only goes green once
#     Copilot has reviewed the exact code being merged and all threads are
#     resolved. It re-evaluates on review + thread-resolution events.
#
# Pairs with the org `production-copilot-review` ruleset, which sets Copilot
# `review_on_push: true` so HEAD always gets reviewed after a fixup push
# (otherwise this gate would deadlock once you push past Copilot's first pass).
#
# Honest limit: "resolved" is a manual acknowledgment, not proof a comment was
# fixed. This forces conscious, per-thread resolution of the current code — it
# cannot force "actually addressed".
name: Reusable Copilot review gate

on:
  workflow_call: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: Copilot review resolved
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require Copilot review of HEAD + all threads resolved
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          # Merge queue (or any context without a PR): the PR checks already
          # passed to enter the queue, so there's nothing to gate here.
          if [ "$EVENT" = "merge_group" ] || [ -z "${PR_NUMBER:-}" ]; then
            echo "No pull-request context (event=$EVENT); passing."
            exit 0
          fi

          OWNER="${REPO%%/*}"
          NAME="${REPO#*/}"
          COPILOT_LOGIN="copilot-pull-request-reviewer"

          # $o/$r/$n below are GraphQL variables (bound via -F), not shell vars,
          # so the query string is intentionally single-quoted.
          # shellcheck disable=SC2016
          data=$(gh api graphql -f query='
            query($o:String!,$r:String!,$n:Int!){
              repository(owner:$o,name:$r){
                pullRequest(number:$n){
                  isDraft
                  headRefOid
                  author{ login __typename }
                  reviews(first:100){ nodes{ author{login} commit{ oid } } }
                  reviewThreads(first:100){ nodes{ isResolved } }
                }
              }
            }' -F o="$OWNER" -F r="$NAME" -F n="$PR_NUMBER")

          pr=$(printf '%s' "$data" | jq '.data.repository.pullRequest')

          if [ "$(printf '%s' "$pr" | jq -r '.isDraft')" = "true" ]; then
            echo "PR is a draft (cannot merge); passing."
            exit 0
          fi

          # Bot-authored PRs (e.g. Dependabot): Copilot may not review them,
          # which would deadlock this gate. Exempt them.
          if [ "$(printf '%s' "$pr" | jq -r '.author.__typename')" = "Bot" ]; then
            echo "PR authored by a bot ($(printf '%s' "$pr" | jq -r '.author.login')); passing."
            exit 0
          fi

          head=$(printf '%s' "$pr" | jq -r '.headRefOid')
          reviewed_head=$(printf '%s' "$pr" \
            | jq --arg c "$COPILOT_LOGIN" --arg h "$head" \
                '[.reviews.nodes[] | select(.author.login==$c and .commit.oid==$h)] | length')
          unresolved=$(printf '%s' "$pr" \
            | jq '[.reviewThreads.nodes[] | select(.isResolved==false)] | length')

          echo "HEAD=$head"
          echo "copilot-reviewed-head=$reviewed_head  unresolved-threads=$unresolved"

          fail=0
          if [ "$reviewed_head" -eq 0 ]; then
            echo "::error::Copilot has not yet reviewed the current HEAD commit. Merge is blocked until Copilot reviews the latest code (it re-reviews on each push)."
            fail=1
          fi
          if [ "$unresolved" -gt 0 ]; then
            echo "::error::${unresolved} review thread(s) unresolved. Resolve every Copilot/@claude review thread on the current code before merging."
            fail=1
          fi

          if [ "$fail" -eq 0 ]; then
            echo "Copilot reviewed HEAD and all review threads are resolved. ✔"
          fi
          exit "$fail"
