# Self-CI for nantobv/.github: verify our own workflows are pinned.
name: Self CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # pinact-check is no longer invoked here. It runs via
  # required-pinact-check.yml on pull_request/merge_queue. This avoids
  # duplicate runs once the production ruleset's required-workflow rule
  # is enabled (see scripts/apply-org-policy.sh and ORG-POLICY.md).
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 'stable'

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.14'
          enable-cache: true

      - name: zizmor
        # Scan composite actions too, so the SHA pins inside
        # .github/actions/*/action.yml are held to the same bar as workflows.
        run: uv tool run zizmor==1.24.1 --min-severity=medium .github/workflows .github/actions
