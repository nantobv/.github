# Reusable Rust CI workflow for the nantobv org.
#
# Usage from a caller repo (.github/workflows/ci.yml):
#
#   name: CI
#   on:
#     push:
#       branches: [main]
#     pull_request:
#   jobs:
#     rust:
#       uses: nantobv/.github/.github/workflows/rust-ci.yml@main
#       with:
#         toolchain: 'stable'
#
# Note: cargo-deny is gated behind run-cargo-deny because it requires a
# deny.toml file. ccd already has one; add it elsewhere before enabling.
name: Reusable Rust CI

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Rust toolchain (e.g. 'stable', '1.82', 'nightly')"
        type: string
        default: 'stable'
      working-directory:
        description: "Subdirectory containing Cargo.toml"
        type: string
        default: '.'
      run-cargo-deny:
        description: "Run cargo-deny (requires deny.toml in repo)"
        type: boolean
        default: false
      run-cargo-audit:
        description: "Run cargo-audit"
        type: boolean
        default: true
      msrv:
        description: "Optional minimum-supported Rust version to also test against"
        type: string
        default: ''
      cargo-audit-version:
        description: "Pinned cargo-audit version"
        type: string
        default: '0.22.1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # Layer 1: correctness - fmt + clippy
  # ---------------------------------------------------------------------------
  fmt-clippy:
    name: Format & Clippy
    runs-on: ubuntu-latest
    # Bound worst-case runtime (default GHA timeout is 360 min). Rust
    # compiles are slow, so ceilings are larger than other languages'.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] rustup installs the requested toolchain; pinact carries the matching org exception.
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ${{ inputs.working-directory }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  # ---------------------------------------------------------------------------
  # Layer 1: correctness - tests
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] rustup installs the requested toolchain; pinact carries the matching org exception.
        with:
          toolchain: ${{ inputs.toolchain }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ${{ inputs.working-directory }}

      - name: Build (all targets compile, incl. benches/examples)
        run: cargo build --all-targets --locked

      - name: Test
        # Default targets: lib + bin + integration. Benches that invoke
        # the built binary against tempdirs etc. can be flaky in CI;
        # they're still compile-checked above. Callers wanting bench
        # tests can run `cargo test --all-targets` in a project-specific
        # workflow.
        run: cargo test --workspace --locked

      - name: Detect doc-test targets
        id: doc-test-targets
        shell: bash
        run: |
          set -euo pipefail
          has_doctest_target="$(
            cargo metadata --no-deps --locked --format-version 1 |
              python3 -c 'import json, sys; metadata = json.load(sys.stdin); print("true" if any(target.get("doctest", False) for package in metadata["packages"] for target in package["targets"]) else "false")'
          )"
          echo "has-doctest-target=${has_doctest_target}" >> "${GITHUB_OUTPUT}"
          if [ "${has_doctest_target}" = "true" ]; then
            echo "Found at least one cargo target with doctests enabled."
          else
            echo "No cargo targets with doctests enabled; skipping cargo test --doc."
          fi

      - name: Doc tests
        if: steps.doc-test-targets.outputs.has-doctest-target == 'true'
        run: cargo test --doc --locked

  # ---------------------------------------------------------------------------
  # Layer 1: correctness - docs build cleanly (catches broken intra-doc links)
  # ---------------------------------------------------------------------------
  doc:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] rustup installs the requested toolchain; pinact carries the matching org exception.
        with:
          toolchain: ${{ inputs.toolchain }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ${{ inputs.working-directory }}

      - name: cargo doc
        run: cargo doc --no-deps --all-features --locked

  # ---------------------------------------------------------------------------
  # Layer 1+: MSRV check - optional. If `msrv` input is set, builds against it.
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV (${{ inputs.msrv }})
    if: ${{ inputs.msrv != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] rustup installs the requested toolchain; pinact carries the matching org exception.
        with:
          toolchain: ${{ inputs.msrv }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ${{ inputs.working-directory }}
          key: msrv
      - run: cargo build --all-targets --locked

  # ---------------------------------------------------------------------------
  # Layer 2: supply chain - cargo-deny (licenses, advisories, sources, bans)
  # ---------------------------------------------------------------------------
  deny:
    name: cargo-deny
    if: ${{ inputs.run-cargo-deny }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2.0.18
        with:
          manifest-path: ${{ inputs.working-directory }}/Cargo.toml

  # ---------------------------------------------------------------------------
  # Layer 2: supply chain - cargo-audit (RustSec advisory DB)
  # ---------------------------------------------------------------------------
  audit:
    name: cargo-audit
    if: ${{ inputs.run-cargo-audit }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install cargo-audit
        env:
          CARGO_AUDIT_VERSION: ${{ inputs.cargo-audit-version }}
        run: cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked
      - name: cargo audit
        # Fails on advisories with `severity: error` (true vulns).
        # Warnings (unsound, unmaintained, notice) are reported but don't fail.
        run: cargo audit
